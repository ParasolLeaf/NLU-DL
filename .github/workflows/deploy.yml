name: Deploy to GitHub Pages

on:
  push:
    branches: [ gh-pages ]  # 从gh-pages分支触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }} # 项目settings中的secrets变量对应deploy key
          ref: gh-pages  # 明确指定检出gh-pages分支

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        env:
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        with:
          publish_dir: ./out
          publish_branch: gh-pages-build  # 先部署到临时分支
          force_orphan: true

      - name: Update gh-pages with built content
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 创建临时目录保存构建文件
          mkdir -p /tmp/build-output
          cp -r ./out/* /tmp/build-output/
          
          # 切换到gh-pages分支并清理
          git fetch origin gh-pages-build
          git checkout gh-pages-build
          
          # 复制构建文件到根目录
          rm -rf .github .next app components hooks lib public styles *.json *.js *.ts *.md *.mjs
          cp -r /tmp/build-output/* ./
          
          # 提交更改
          git add .
          git commit -m "Deploy built site" || exit 0
          git push origin gh-pages-build:gh-pages --force